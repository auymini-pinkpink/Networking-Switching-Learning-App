<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetSwitch Academy - Networks & Switching Learning App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col antialiased">
  <!-- Navigation Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">⚡</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
          NetSwitch Academy
        </h1>
      </div>
      <nav class="flex space-x-4 md:space-x-6 text-sm font-medium">
        <button onclick="switchTab('dashboard')" class="hover:text-blue-400 transition cursor-pointer">Dashboard</button>
        <button onclick="switchTab('modules')" class="hover:text-blue-400 transition cursor-pointer">Modules</button>
        <button onclick="switchTab('calculators')" class="hover:text-blue-400 transition cursor-pointer">Calculators</button>
        <button onclick="switchTab('simulators')" class="hover:text-blue-400 transition cursor-pointer">Simulators</button>
        <button onclick="switchTab('exam')" class="hover:text-blue-400 transition cursor-pointer">Mock Exam</button>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-container" class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
    <div class="space-y-6">
      <h2 class="text-2xl font-bold text-slate-100">Loading Study Dashboard...</h2>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-800 border-t border-slate-700 p-4 text-center text-xs text-slate-400">
    <p>NetSwitch Academy — Independent Cybersecurity & Networking Study Tool. Official unit outlines remain primary assessment sources.</p>
  </footer>

  <!-- Modular Scripts -->
  <script src="js/calculators/subnetting.js"></script>
  <script src="js/calculators/vlsm.js"></script>
  <script src="js/calculators/fragmentation.js"></script>
  <script src="js/simulators/stp.js"></script>
  <script src="js/simulators/vlan.js"></script>
  <script src="js/simulators/tcp.js"></script>
  <script src="js/data/lessons.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
